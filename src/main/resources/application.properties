spring.application.name=econnect
server.port=8080

# --- MySQL (override with environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/econnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- CORS: React dev servers (CRA = 3000, Vite = 5173) ---
econnect.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174
